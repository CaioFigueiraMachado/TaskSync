<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskSync - Cadastro de Usuário</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">🚀 TaskSync</div>
        <div class="nav-links">
            <a href="index.html">Kanban</a>
            <a href="cadastro_tarefa.html">Nova Tarefa</a>
            <a href="cadastro_usuario.html" style="color: var(--primary);">Novo Usuário</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2 style="margin-bottom: 1.5rem;">Cadastrar Novo Usuário</h2>
            <div id="alertMsg" class="alert"></div>
            
            <form id="formUsuario">
                <div class="form-group">
                    <label for="nome">Nome Completo *</label>
                    <input type="text" id="nome" name="nome" class="form-control" required placeholder="Digite o nome do colaborador">
                </div>
                <div class="form-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="email@empresa.com.br">
                </div>
                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Cadastrar Usuário</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
