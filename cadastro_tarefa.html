<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskSync - Cadastro de Tarefa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">🚀 TaskSync</div>
        <div class="nav-links">
            <a href="index.html">Kanban</a>
            <a href="cadastro_tarefa.html" style="color: var(--primary);">Nova Tarefa</a>
            <a href="cadastro_usuario.html">Novo Usuário</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2 style="margin-bottom: 1.5rem;">Gerenciar Tarefa</h2>
            <div id="alertMsg" class="alert"></div>
            
            <form id="formTarefa">
                <input type="hidden" name="acao" id="acao" value="cadastrar">
                <input type="hidden" name="id" id="tarefa_id" value="">
                
                <div class="form-group">
                    <label for="descricao">Descrição da Tarefa *</label>
                    <input type="text" id="descricao" name="descricao" class="form-control" required placeholder="O que precisa ser feito?">
                </div>

                <div class="form-group">
                    <label for="usuario_id">Usuário Responsável *</label>
                    <select id="usuario_id" name="usuario_id" class="form-control" required>
                        <option value="">Selecione um usuário</option>
                        <!-- Options carregados via JS -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="setor">Setor *</label>
                    <select id="setor" name="setor" class="form-control" required>
                        <option value="">Selecione o setor</option>
                        <option value="Desenvolvimento">Desenvolvimento</option>
                        <option value="Design">Design</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Suporte">Suporte</option>
                        <option value="Financeiro">Financeiro</option>
                        <option value="Recursos Humanos">Recursos Humanos</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="prioridade">Prioridade *</label>
                    <select id="prioridade" name="prioridade" class="form-control" required>
                        <option value="">Selecione a prioridade</option>
                        <option value="baixa">Baixa</option>
                        <option value="media">Média</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>
                
                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Salvar Tarefa</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
